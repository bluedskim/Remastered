{% extends "base.html" %}
{% block title %}로그인 설정 필요 — Remastered{% endblock %}
{% block content %}
<section class="card">
  <h2>Google 로그인이 아직 설정되지 않았습니다</h2>
  <p>
    서버 관리자가 <code>REMASTERED_GOOGLE_CLIENT_ID</code>와
    <code>REMASTERED_GOOGLE_CLIENT_SECRET</code> (또는 웹 OAuth 클라이언트 JSON)을
    설정해야 합니다.
  </p>
  <p class="muted">
    설정이 완료되면 이 페이지에서 Google로 로그인할 수 있습니다.
  </p>
  <p><a href="/">← 첫 화면으로</a></p>
</section>
{% endblock %}
