{% extends "base.html" %}
{% block title %}Log in · Remastered{% endblock %}
{% block content %}
<section class="card auth-card">
  <h1 class="card-title">Log in</h1>
  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/login" class="auth-form">
    {% if next %}
    <input type="hidden" name="next" value="{{ next }}" />
    {% endif %}
    <label class="field">
      <span class="field-label">Email</span>
      <input type="email" name="login_id" required autocomplete="email"
             value="{{ login_id | default('') }}" placeholder="you@example.com" />
    </label>
    <label class="field">
      <span class="field-label">Password</span>
      <input type="password" name="password" required autocomplete="current-password" minlength="8" />
    </label>
    <button type="submit" class="btn btn-gradient btn-xl">Log in</button>
  </form>
  <p class="auth-switch muted small">No account? <a href="{{ signup_href | default('/signup') }}">Sign up</a></p>
</section>
{% endblock %}
