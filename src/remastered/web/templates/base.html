<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Remastered{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/dashboard">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="brand-text">
          <span class="brand-name">Remastered</span>
          <span class="brand-tagline">YouTube 오디오를 레퍼런스에 맞춰 리마스터</span>
        </span>
      </a>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer small muted">
      <p>개인정보: {{ privacy_notice | default("세션·작업 메타데이터만 저장합니다.") }}</p>
    </footer>
  </div>
</body>
</html>
