<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Remaster YouTube audio to a reference track and compare original vs remastered in your browser." />
  <meta name="theme-color" content="#07060f" />
  <title>{% block title %}Remastered{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ static_url('favicon.svg') }}" />
  <link rel="icon" type="image/png" sizes="32x32" href="{{ static_url('favicon-32.png') }}" />
  <link rel="icon" type="image/png" sizes="16x16" href="{{ static_url('favicon-16.png') }}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{{ static_url('apple-touch-icon.png') }}" />
  <link rel="manifest" href="{{ static_url('site.webmanifest') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" crossorigin="anonymous" />
  <link rel="stylesheet" href="{{ static_url('style.css') }}" />
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
<body>
  <div class="page-bg" aria-hidden="true"></div>
  <div class="wrap">
    <header class="site-header">
      <a class="brand" href="/dashboard">
        <span class="brand-mark" aria-hidden="true">◆</span>
        <span class="brand-text">
          <span class="brand-name">Remastered</span>
          <span class="brand-tagline">Remaster YouTube audio to your reference track</span>
        </span>
      </a>
      <nav class="site-auth" aria-label="Account">
        {% if auth_user %}
        <span class="auth-nickname">{{ auth_user.nickname }}</span>
        <form class="auth-logout-form" method="post" action="/logout">
          <button type="submit" class="btn btn-ghost btn-sm">Log out</button>
        </form>
        {% else %}
        <a class="auth-link" href="/login">Log in</a>
        <a class="auth-link auth-link-primary" href="/signup">Sign up</a>
        {% endif %}
      </nav>
    </header>
    <main class="site-main">
      {% block content %}{% endblock %}
    </main>
    <footer class="site-footer small muted">
      <p>Privacy: {{ privacy_notice | default("We store session and job metadata only.") }}</p>
    </footer>
  </div>
</body>
</html>
