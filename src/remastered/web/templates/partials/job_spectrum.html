{% if spectrum_comparison and job.status == 'completed' %}
<details class="card spectrum-panel" data-spectrum-panel>
  <summary class="spectrum-panel__summary">
    <span class="spectrum-panel__title">Spectrum</span>
    <span class="spectrum-panel__hint small muted">Compare tonal balance</span>
  </summary>
  <div class="spectrum-panel__body">
    <div class="spectrum-mode-toggle" role="group" aria-label="Spectrum display mode">
      <button type="button" class="spectrum-mode-toggle__btn is-active" data-spectrum-mode="tone" aria-pressed="true">
        Tone (matched)
      </button>
      <button type="button" class="spectrum-mode-toggle__btn" data-spectrum-mode="actual" aria-pressed="false">
        Actual level
      </button>
    </div>
    <p class="spectrum-panel__caption" data-spectrum-caption>
      Tone only: all curves are matched to the same loudness. See the volume line above for level change.
    </p>
    <p class="spectrum-level-note small" data-spectrum-level-note hidden></p>
    <script type="application/json" class="spectrum-data">{{ spectrum_comparison | tojson }}</script>
    <div
      class="spectrum-chart"
      data-spectrum-chart
      role="img"
      aria-label="Spectrum comparison of original, reference, and remastered audio"
    ></div>
    <ul class="spectrum-legend" aria-hidden="true">
      <li><span class="spectrum-legend__swatch spectrum-legend__swatch--original"></span> Original</li>
      <li><span class="spectrum-legend__swatch spectrum-legend__swatch--reference"></span> Reference</li>
      <li><span class="spectrum-legend__swatch spectrum-legend__swatch--remastered"></span> Remastered</li>
    </ul>
    <p class="spectrum-tooltip small muted" data-spectrum-tooltip hidden></p>
  </div>
</details>
{% endif %}
