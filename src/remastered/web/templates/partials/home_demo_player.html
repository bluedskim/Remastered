{% if home_demo_samples %}
<section class="hero-demo card card-compact" aria-labelledby="hero-demo-heading">
  <h2 class="section-title section-title--sm" id="hero-demo-heading">Hear the difference</h2>
  <p class="small muted hero-demo-lead">Sample before and after — toggle Original vs Remastered.</p>
  <div class="ab-compare ab-compare--compact" data-ab-compare>
    <div class="ab-listen-toggle" role="group" aria-label="Listening source" data-ab-listen-toggle>
      <span class="ab-listen-label">Listening:</span>
      <button type="button" class="ab-listen-btn" data-ab-side="original" aria-pressed="false">Original</button>
      <span class="ab-listen-sep" aria-hidden="true">|</span>
      <button type="button" class="ab-listen-btn ab-listen-btn--active" data-ab-side="remastered" aria-pressed="true">Remastered</button>
      <span class="ab-loudness-attenuation small muted" data-ab-loudness-attenuation hidden aria-live="polite"></span>
    </div>
    <div class="ab-audio-host" aria-hidden="true">
      <audio data-audio="original" preload="metadata" src="{{ static_path_url(home_demo_samples.before_static_path) }}"></audio>
      <audio data-audio="remastered" preload="metadata" src="{{ static_path_url(home_demo_samples.after_static_path) }}"></audio>
    </div>
    <div class="ab-transport ab-transport--compact">
      <button type="button" class="ab-play-btn" data-ab-play aria-label="Play" title="Play (Space)">▶</button>
      <button type="button" class="ab-repeat-btn" data-ab-repeat aria-pressed="true" aria-label="Repeat" title="Repeat (R)">🔁</button>
      <span class="ab-time" data-ab-time-current>0:00</span>
      <input type="range" class="ab-seek" data-ab-seek min="0" max="1000" value="0" step="1" aria-label="Playback position" />
      <span class="ab-time" data-ab-time-duration>0:00</span>
    </div>
  </div>
</section>
{% endif %}
