{% if audio_ok or mastered_ok %}
<section class="card">
  <h3>오디오</h3>
  {% if audio_ok %}
  <div class="player">
    <p><strong>원본</strong></p>
    <audio controls preload="none" src="/media/{{ job.id }}/audio"></audio>
    <a class="btn btn-secondary" href="/media/{{ job.id }}/audio?download=1"{% if audio_download_filename %} download="{{ audio_download_filename }}"{% endif %}>다운로드</a>
  </div>
  {% endif %}

  {% if mastered_ok %}
  <div class="player">
    <p><strong>마스터 결과</strong></p>
    <audio controls preload="none" src="/media/{{ job.id }}/mastered"></audio>
    <a class="btn btn-secondary" href="/media/{{ job.id }}/mastered?download=1"{% if mastered_download_filename %} download="{{ mastered_download_filename }}"{% endif %}>다운로드</a>
  </div>
  {% endif %}
  <p class="rights-notice-inline small muted">{{ rights_notice_short }}</p>
</section>
{% endif %}
