{% extends "base.html" %}
{% block title %}Sign up · Remastered{% endblock %}
{% block content %}
<section class="card auth-card" id="signup-root" data-cooldown="{{ resend_cooldown_seconds }}">
  <h1 class="card-title">Sign up</h1>
  {% if error %}
  <p class="form-error" role="alert">{{ error }}</p>
  {% endif %}
  <form method="post" action="/signup" class="auth-form" id="signup-form">
    {% if next %}
    <input type="hidden" name="next" value="{{ next }}" />
    {% endif %}
    <label class="field">
      <span class="field-label">Email</span>
      <div class="auth-email-row">
        <input type="email" name="login_id" id="signup-email" required autocomplete="email"
               value="{{ login_id | default('') }}" placeholder="you@example.com" />
        <button type="button" class="btn btn-secondary" id="send-verification-btn">Send code</button>
      </div>
      <span class="muted small" id="send-verification-status" aria-live="polite"></span>
    </label>
    <label class="field">
      <span class="field-label">Verification code (6 digits)</span>
      <input type="text" name="verification_code" inputmode="numeric" pattern="[0-9]{6}"
             maxlength="6" required autocomplete="one-time-code" placeholder="000000" />
    </label>
    <label class="field">
      <span class="field-label">Password (8+ characters)</span>
      <input type="password" name="password" required minlength="8" autocomplete="new-password" />
    </label>
    <label class="field">
      <span class="field-label">Confirm password</span>
      <input type="password" name="password_confirm" required minlength="8" autocomplete="new-password" />
    </label>
    <label class="field">
      <span class="field-label">Nickname (2–12 characters)</span>
      <input type="text" name="nickname" id="signup-nickname" required
             value="{{ nickname | default('') }}" maxlength="12" autocomplete="nickname" />
      <span class="muted small" id="nickname-status" aria-live="polite"></span>
    </label>
    <button type="submit" class="btn btn-gradient btn-xl">Create account</button>
  </form>
  <p class="auth-switch muted small">Already have an account? <a href="{{ login_href | default('/login') }}">Log in</a></p>
</section>
<script src="{{ static_url('signup.js') }}"></script>
{% endblock %}
